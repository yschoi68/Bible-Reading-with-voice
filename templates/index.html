<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날마다 성경을 검토함 (Edge AI 음성)</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Malgun Gothic', sans-serif; max-width: 680px; margin: 20px auto; padding: 0 15px; background-color: #f4f6f8; }
        
        /* Edge 권장 안내 배너 (기본 숨김) */
        .edge-recommend-banner {
            display: none;
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.92rem;
            line-height: 1.5;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .edge-btn {
            background-color: #0078d4;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
            white-space: nowrap;
            text-decoration: none;
            display: inline-block;
        }
        .edge-btn:hover { background-color: #005a9e; }

        /* 상단 타이틀 배너 스타일 */
        .header-banner {
            background: linear-gradient(135deg, #1a365d 0%, #2b6cb0 100%);
            color: white;
            padding: 25px 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
        }
        .header-banner::before {
            content: "📖";
            font-size: 8rem;
            position: absolute;
            right: -20px;
            bottom: -30px;
            opacity: 0.12;
            transform: rotate(-15deg);
        }
        .header-banner h1 {
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: -0.5px;
            font-weight: 700;
        }
        .header-banner p {
            margin: 8px 0 0 0;
            font-size: 0.95rem;
            opacity: 0.85;
            font-weight: 300;
        }

        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 0 0 12px 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.06); 
        }
        
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #edf2f7; padding: 8px 12px; border-radius: 8px; }
        .nav-btn { background-color: #4a5568; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: 0.2s; }
        .nav-btn:hover { background-color: #2d3748; }
        .nav-today { background-color: #3182ce; }
        .nav-today:hover { background-color: #2b6cb0; }
        
        .date { color: #4a5568; font-weight: bold; font-size: 1.15rem; text-align: center; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        
        /* 상단 플레이어 버튼 컨트롤 영역 */
        .player-control {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .play-btn { padding: 10px 24px; font-size: 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-play { background-color: #2b6cb0; color: white; }
        .btn-play:hover { background-color: #2c5282; }
        .btn-stop { background-color: #e53e3e; color: white; }
        .btn-stop:hover { background-color: #c53030; }

        .scripture { font-size: 1.15rem; font-weight: bold; color: #1a365d; background: #ebf8ff; padding: 18px; border-left: 5px solid #3182ce; border-radius: 6px; margin-bottom: 18px; line-height: 1.6; }
        .content { line-height: 1.85; color: #2d3748; font-size: 1.05rem; }
        
        .voice-info { font-size: 0.85rem; color: #718096; margin-top: 20px; background: #f8fafc; padding: 8px 12px; border-radius: 5px; border: 1px solid #e2e8f0; text-align: center; }
        
        #loading { text-align: center; padding: 40px; font-weight: bold; color: #4a5568; }
    </style>
</head>
<body>

<!-- Edge 권장 메시지 배너 -->
<div id="edge-banner" class="edge-recommend-banner">
    <div>
        💡 <b>Microsoft Edge 웹브라우저</b>를 사용하시면 더 자연스러운 음성을 들으실 수 있습니다.
    </div>
    <a id="edge-link" href="#" class="edge-btn" onclick="openInEdge(event)">Edge로 열기</a>
</div>

<!-- 상단 타이틀 배너 -->
<div class="header-banner">
    <h1>날마다 성경을 검토함</h1>
    <p>JW.ORG daily text reader with natural AI voice</p>
</div>

<div class="card">
    <!-- 날짜 이동 내비게이션 바 -->
    <div class="nav-bar">
        <button class="nav-btn" onclick="changeDate(currentPrevDate)">◀ 이전날</button>
        <button class="nav-btn nav-today" onclick="changeDate('')">오늘</button>
        <button class="nav-btn" onclick="changeDate(currentNextDate)">다음날 ▶</button>
    </div>

    <div id="loading">성구를 읽어오는 중입니다...</div>

    <div id="content-box" style="display: none;">
        <!-- 날짜 표시 -->
        <div id="date-text" class="date"></div>
        
        <!-- 상단 배치된 재생/정지 버튼 -->
        <div class="player-control">
            <button class="play-btn btn-play" onclick="playSpeech()">▶️ 읽기</button>
            <button class="play-btn btn-stop" onclick="stopSpeech()">⏹️ 정지</button>
        </div>

        <!-- 성구 구절 및 본문 내용 -->
        <div id="scripture-text" class="scripture"></div>
        <div id="body-text" class="content"></div>
        
        <!-- 사용 음성 표시 -->
        <div id="voice-name" class="voice-info">사용 중인 음성 엔진 확인 중...</div>
    </div>
</div>

<script>
    let textToSpeech = ""; 
    let currentPrevDate = "";
    let currentNextDate = "";
    const synth = window.speechSynthesis;

    // 현재 접속 브라우저가 Edge인지 검사
    function checkEdgeBrowser() {
        const userAgent = navigator.userAgent;
        const isEdge = userAgent.includes("Edg/") || userAgent.includes("Edge/");
        
        if (!isEdge) {
            const banner = document.getElementById('edge-banner');
            banner.style.display = 'flex';
        }
    }

    // Edge 브라우저로 열기 시도 함수
    function openInEdge(e) {
        e.preventDefault();
        const currentUrl = window.location.href.replace(/^https?:\/\//, '');
        window.location.href = "microsoft-edge-https://" + currentUrl;
    }

    // 성구 표기를 TTS 발음용 한글로 변환하는 함수
    function convertBibleForTTS(text) {
        if (!text) return text;

        function numToKor(numStr) {
            const units = ['', '십', '백', '천'];
            const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
            let n = parseInt(numStr, 10);
            if (isNaN(n)) return numStr;
            if (n === 0) return '영';
            
            let sNum = n.toString();
            let len = sNum.length;
            let result = '';

            for (let i = 0; i < len; i++) {
                let d = parseInt(sNum[i], 10);
                let unitIdx = len - i - 1;
                if (d !== 0) {
                    if (d === 1 && unitIdx > 0) {
                        result += units[unitIdx];
                    } else {
                        result += digits[d] + units[unitIdx];
                    }
                }
            }
            return result;
        }

        return text.replace(/([가-힣]+)?\s*(\d+)\s*:\s*([\d\s,-]+)/g, function(match, book, ch, v) {
            let bookName = book ? book.trim() : '';
            let unit = (bookName.includes('시편') || bookName.includes('시')) ? '편' : '장';
            
            let chKor = numToKor(ch);
            let vKor = v.replace(/\d+/g, function(digit) {
                return numToKor(digit);
            });

            return `${bookName} ${chKor}${unit} ${vKor}절`;
        });
    }

    // 지정된 날짜의 성구 데이터를 로드하는 함수
    function loadDailyText(dateStr = '') {
        stopSpeech();

        document.getElementById('loading').style.display = 'block';
        document.getElementById('content-box').style.display = 'none';

        let url = '/api/daily-text';
        if (dateStr) {
            url += `?date=${dateStr}`;
        }

        fetch(url)
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    currentPrevDate = data.prev_date;
                    currentNextDate = data.next_date;

                    document.getElementById('date-text').innerText = data.date;
                    document.getElementById('scripture-text').innerText = data.scripture;
                    document.getElementById('body-text').innerText = data.content;
                    
                    let fullText = `${data.scripture}. ${data.content}`;
                    textToSpeech = convertBibleForTTS(fullText);

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content-box').style.display = 'block';

                    setTimeout(updateVoiceStatus, 300);
                } else {
                    document.getElementById('loading').innerText = "성구를 가져오지 못했습니다.";
                }
            })
            .catch(err => {
                document.getElementById('loading').innerText = "네트워크 오류가 발생했습니다.";
            });
    }

    function changeDate(targetDate) {
        loadDailyText(targetDate);
    }

    // 남성 목소리 최우선 선택
    function getEdgeBestVoice() {
        const voices = synth.getVoices();
        
        let bestVoice = voices.find(v => v.lang.includes('ko') && (v.name.includes('InJoon') || v.name.includes('InJoonOnline')));
        
        if (!bestVoice) {
            bestVoice = voices.find(v => v.lang.includes('ko') && (v.name.includes('Male') || v.name.includes('남성')));
        }
        
        if (!bestVoice) {
            bestVoice = voices.find(v => v.lang.includes('ko') && v.name.includes('Google') && v.name.includes('Male'));
        }

        if (!bestVoice) {
            bestVoice = voices.find(v => v.lang.includes('ko') && v.name.includes('Natural'));
        }

        if (!bestVoice) {
            bestVoice = voices.find(v => v.lang.includes('ko'));
        }

        return bestVoice;
    }

    function updateVoiceStatus() {
        const voice = getEdgeBestVoice();
        const infoElem = document.getElementById('voice-name');
        if (voice) {
            infoElem.innerText = "🎙️ 적용된 음성: " + voice.name;
        } else {
            infoElem.innerText = "🎙️ 기본 한국어 음성 사용 중";
        }
    }

    function playSpeech() {
        if (!synth) {
            alert("이 브라우저는 음성 재생을 지원하지 않습니다.");
            return;
        }

        synth.cancel();

        const utterance = new SpeechSynthesisUtterance(textToSpeech);
        const selectedVoice = getEdgeBestVoice();

        if (selectedVoice) {
            utterance.voice = selectedVoice;
        }

        utterance.lang = 'ko-KR';
        utterance.rate = 0.95;
        utterance.pitch = 0.95;

        synth.speak(utterance);
    }

    function stopSpeech() {
        if (synth) {
            synth.cancel();
        }
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = updateVoiceStatus;
    }

    // 페이지 시작 시 실행
    checkEdgeBrowser();
    loadDailyText();
</script>

</body>
</html>
