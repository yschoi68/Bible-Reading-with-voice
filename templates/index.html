<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날마다 성경을 검토함</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Malgun Gothic', sans-serif; max-width: 680px; margin: 20px auto; padding: 0 15px; background-color: #f4f6f8; }
        
        .header-banner {
            background: linear-gradient(135deg, #1a365d 0%, #2b6cb0 100%);
            color: white;
            padding: 25px 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        .header-banner h1 { margin: 0; font-size: 1.6rem; font-weight: 700; }
        .header-banner p { margin: 8px 0 0 0; font-size: 0.95rem; opacity: 0.85; }

        .card { background: white; padding: 25px; border-radius: 0 0 12px 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #edf2f7; padding: 8px 12px; border-radius: 8px; }
        .nav-btn { background-color: #4a5568; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
        .nav-today { background-color: #3182ce; }
        
        .date { color: #4a5568; font-weight: bold; font-size: 1.15rem; text-align: center; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        
        .player-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .btn-row { display: flex; gap: 12px; justify-content: center; width: 100%; }
        .play-btn { padding: 10px 24px; font-size: 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-play { background-color: #2b6cb0; color: white; }
        .btn-stop { background-color: #e53e3e; color: white; }

        .scripture { font-size: 1.15rem; font-weight: bold; color: #1a365d; background: #ebf8ff; padding: 18px; border-left: 5px solid #3182ce; border-radius: 6px; margin-bottom: 18px; line-height: 1.6; }
        .content { line-height: 1.85; color: #2d3748; font-size: 1.05rem; }
        
        .voice-info { font-size: 0.85rem; color: #718096; margin-top: 20px; background: #f8fafc; padding: 8px 12px; border-radius: 5px; border: 1px solid #e2e8f0; text-align: center; }
        #loading { text-align: center; padding: 40px; font-weight: bold; color: #4a5568; }
    </style>
</head>
<body>

<div class="header-banner">
    <h1>날마다 성경을 검토함</h1>
    <p>JW.ORG daily text reader</p>
</div>

<div class="card">
    <div class="nav-bar">
        <button class="nav-btn" onclick="changeDate(currentPrevDate)">◀ 이전날</button>
        <button class="nav-btn nav-today" onclick="changeDate('')">오늘</button>
        <button class="nav-btn" onclick="changeDate(currentNextDate)">다음날 ▶</button>
    </div>

    <div id="loading">성구를 읽어오는 중입니다...</div>

    <div id="content-box" style="display: none;">
        <div id="date-text" class="date"></div>
        
        <div class="player-control">
            <div class="btn-row">
                <button id="play-btn" class="play-btn btn-play" onclick="togglePlay()">▶️ 읽기</button>
                <button class="play-btn btn-stop" onclick="stopAudio()">⏹️ 정지</button>
            </div>
        </div>

        <div id="scripture-text" class="scripture"></div>
        <div id="body-text" class="content"></div>
        
        <div id="voice-name" class="voice-info">🎙️ 기기 내장 Web Speech API 엔진 사용 중</div>
    </div>
</div>

<script>
    let currentSpeechText = ""; 
    let currentPrevDate = "";
    let currentNextDate = "";
    let isPlaying = false;

    const playBtn = document.getElementById('play-btn');
    const synth = window.speechSynthesis;

    function loadDailyText(dateStr = '') {
        stopAudio();

        document.getElementById('loading').style.display = 'block';
        document.getElementById('content-box').style.display = 'none';

        let url = '/api/daily-text';
        if (dateStr) {
            url += `?date=${dateStr}`;
        }

        fetch(url)
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    currentPrevDate = data.prev_date;
                    currentNextDate = data.next_date;
                    currentSpeechText = data.speech_text;

                    document.getElementById('date-text').innerText = data.date;
                    document.getElementById('scripture-text').innerText = data.scripture;
                    document.getElementById('body-text').innerText = data.content;

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content-box').style.display = 'block';
                } else {
                    document.getElementById('loading').innerText = "성구를 가져오지 못했습니다.";
                }
            })
            .catch(err => {
                document.getElementById('loading').innerText = "네트워크 오류가 발생했습니다.";
            });
    }

    function changeDate(targetDate) {
        loadDailyText(targetDate);
    }

    function togglePlay() {
        if (isPlaying) {
            if (synth.paused) {
                synth.resume();
                playBtn.innerText = "⏸️ 일시정지";
            } else {
                synth.pause();
                playBtn.innerText = "▶️ 다시 읽기";
            }
        } else {
            playSpeech();
        }
    }

    function playSpeech() {
        if (!currentSpeechText) return;

        synth.cancel(); // 이전 음성 초기화

        const utterance = new SpeechSynthesisUtterance(currentSpeechText);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.95; // 읽기 속도 (약간 천천히)

        utterance.onstart = function() {
            isPlaying = true;
            playBtn.innerText = "⏸️ 일시정지";
        };

        utterance.onend = function() {
            isPlaying = false;
            playBtn.innerText = "▶️ 읽기";
        };

        utterance.onerror = function(e) {
            console.error("TTS Error:", e);
            isPlaying = false;
            playBtn.innerText = "▶️ 읽기";
        };

        synth.speak(utterance);
    }

    function stopAudio() {
        synth.cancel();
        isPlaying = false;
        playBtn.innerText = "▶️ 읽기";
    }

    loadDailyText();
</script>

</body>
</html>
